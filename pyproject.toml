[project]
name = "flyconn-gym"
version = "0.0.1"
description = "An open, controlled brain-body loop: flyconn connectomes drive a FlyGym fly, always beside null wirings."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "flyconn contributors" }]
keywords = ["connectome", "drosophila", "neuromechfly", "flygym", "mujoco"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "flyconn[sim]>=0.4,<0.5",
  "flygym",
  "gymnasium>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "pyright>=1.1.380", "imageio>=2.34", "tabulate>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyconn_gym"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["physics: needs MuJoCo/FlyGym (slower, still offline)"]
